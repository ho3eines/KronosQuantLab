[project]
name = "kronos-quant-lab"
version = "0.1.0"
description = "Local research lab for evaluating Kronos forecasting models on daily crypto data. Research only; no trading."
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["checkpoint: needs the real downloaded Kronos weights (skipped when absent)"]
